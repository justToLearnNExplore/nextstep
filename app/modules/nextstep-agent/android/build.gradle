plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.northstar.nextstep.agent'
version = '0.1.0'

android {
  namespace "com.northstar.nextstep.agent"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Android 10+. Screenshots: AccessibilityService.takeScreenshot on 11+, MediaProjection on 10.
    minSdkVersion 29
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"

  // Medicine photo: in-app camera with on-device label-readability guidance.
  def camerax = "1.6.2"
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
